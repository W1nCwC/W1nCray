Log:
  Level: warning # Log level: none, error, warning, info, debug 
  AccessPath: # /etc/W1nCray/access.Log
  ErrorPath: # /etc/W1nCray/error.log
DnsConfigPath: # /etc/W1nCray/dns.json # Path to dns config, check https://xtls.github.io/config/dns.html for help
RouteConfigPath: /etc/W1nCray/route.json # Path to route config, check https://xtls.github.io/config/routing.html for help
InboundConfigPath: /etc/W1nCray/custom_inbound.json # Path to custom inbound config, check https://xtls.github.io/config/inbound.html for help
OutboundConfigPath: /etc/W1nCray/custom_outbound.json # Path to custom outbound config, check https://xtls.github.io/config/outbound.html for help
ConnectionConfig:
  Handshake: 4 # 4秒握手超时，适中
  ConnIdle: 1800 # 空闲连接 5 分钟后才断开
  UplinkOnly: 60 # 10秒无数据才关闭连接
  DownlinkOnly: 60 # 10秒无数据才关闭连接
  BufferSize: 8192 # 适当增加缓冲区，减少断流
Nodes:
  - PanelType: "Xboard" # Panel type: SSpanel, NewV2board, V2board, PMpanel, Proxypanel
    ApiConfig:
      ApiHost: "https://panel.example.com"
      ApiKey: "fixture-apikey"
      NodeID: 173
      NodeType: vmess # Node type: V2ray, Trojan, Shadowsocks, Shadowsocks-Plugin
      Timeout: 10 # Timeout for the api request
      EnableXTLS: false # Enable XTLS for V2ray and Trojan
      SpeedLimit: 0 # Mbps, Local settings will replace remote settings, 0 means disable
      DeviceLimit: 0 # Local settings will replace remote settings, 0 means disable
      RuleListPath: # /etc/W1nCray/rulelist Path to local rulelist file
    ControllerConfig:
      ListenIP: 0.0.0.0 # IP address you want to listen
      SendIP: 0.0.0.0 # IP address you want to send pacakage
      UpdatePeriodic: 60 # Time to update the nodeinfo, how many sec.
      EnableDNS: false # Use custom DNS config, Please ensure that you set the dns.json well
      DNSType: AsIs # AsIs, UseIP, UseIPv4, UseIPv6, DNS strategy
      DisableUploadTraffic: false # Disable Upload Traffic to the panel
      DisableGetRule: false # Disable Get Rule from the panel
      DisableSniffing: false # Disable domain sniffing 
      EnableProxyProtocol: true
      AutoSpeedLimitConfig:
        Limit: 0 # Warned speed. Set to 0 to disable AutoSpeedLimit (mbps)
        WarnTimes: 0 # After (WarnTimes) consecutive warnings, the user will be limited. Set to 0 to punish overspeed user immediately.
        LimitSpeed: 0 # The speedlimit of a limited user (unit: mbps)
        LimitDuration: 0 # How many minutes will the limiting last (unit: minute)
      EnableFallback: false # Only support for Trojan and Vless
      FallBackConfigs: # Support multiple fallbacks
        - SNI: # TLS SNI(Server Name Indication), Empty for any
          Alpn: # Alpn, Empty for any
          Path: # HTTP PATH, Empty for any
          Dest: 80 # Required, Destination of fallback, check https://xtls.github.io/config/fallback/ for details.
          ProxyProtocolVer: 0 # Send PROXY protocol version, 0 for dsable
      CertConfig:
        CertMode: dns # Option about how to get certificate: none, file, http, dns. Choose "none" will forcedly disable the tls config.
        RejectUnknownSni: false # Reject unknown SNI
        CertDomain: "node.example.com" # Domain to cert
        CertFile: /etc/W1nCray/cert/cert1.cert # Provided if the CertMode is file
        KeyFile: /etc/W1nCray/cert/cert1.key
        Provider: cloudflare # DNS cert provider, Get the full support list here: https://go-acme.github.io/lego/dns/
        Email: a@b.c
        DNSEnv: # DNS ENV option used by DNS provider
          CLOUDFLARE_EMAIL: a@b.c
          CLOUDFLARE_API_KEY: fixture-cf-secret
